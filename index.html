<!doctype html>
<html lang="ko">
<head>

  <link rel="stylesheet" href="./home/home.css">
</head>
<body>
  <div class="page">
    <nav class="topnav" aria-label="사이트">
      <a class="logo" href="./" aria-label="동키의 잡동사니 홈">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40"><ellipse cx="15" cy="12" rx="3.2" ry="8" transform="rotate(-16 15 12)"/><ellipse cx="25" cy="12" rx="3.2" ry="8" transform="rotate(16 25 12)"/><ellipse cx="20" cy="23" rx="9" ry="10"/><ellipse class="muzzle" cx="20" cy="28" rx="6" ry="4.3"/></svg>
        </span>
        <span>동키의 잡동사니</span>

    <header class="hero">
      <div class="hero-text">
        <p class="eyebrow">Donkey’s Little Things</p>
        <h1>동키의 잡동사니,<span>어쩌면 쓸모 있을지도<br class="br-sm"> 모르는 것들.</span></h1>
        <p class="lead">필요할 때 꺼내 쓰는 작은 웹 도구들을 하나씩 모아 두는 서랍이에요.<br>설치도, 로그인도 없이 브라우저에서 바로 열어 쓰세요.</p>
        <a class="hero-cta" href="#drawer">서랍 열어 보기<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m-6-6 6 6 6-6"/></svg></a>
      </div>

      <div class="seal" aria-hidden="true">
        <svg viewBox="0 0 240 240">
          <defs><path id="ring" d="M120,120 m-101,0 a101,101 0 1,1 202,0 a101,101 0 1,1 -202,0"/></defs>
          <circle cx="120" cy="120" r="116" class="seal-outer"/>
          <g class="seal-text"><text><textPath href="#ring" textLength="628" lengthAdjust="spacing">DONKEY’S LITTLE THINGS ✦ THINGS THAT MIGHT BE USEFUL ✦</textPath></text></g>
          <circle cx="120" cy="120" r="86" class="seal-inner"/>
          <g class="donkey">
            <g class="ear ear-l"><ellipse cx="101" cy="86" rx="10" ry="27" transform="rotate(-18 101 86)" class="d-line"/><ellipse cx="101" cy="88" rx="4.5" ry="17" transform="rotate(-18 101 88)" class="d-pink"/></g>
            <g class="ear ear-r"><ellipse cx="139" cy="86" rx="10" ry="27" transform="rotate(18 139 86)" class="d-line"/><ellipse cx="139" cy="88" rx="4.5" ry="17" transform="rotate(18 139 88)" class="d-pink"/></g>
            <ellipse cx="120" cy="134" rx="35" ry="38" class="d-line"/>
            <path d="M108 100q6-12 12-3q6-12 12 3" class="d-mane"/>
            <ellipse cx="120" cy="155" rx="24" ry="17" class="d-muzzle"/>
            <g class="eyes"><circle cx="106" cy="127" r="3.8"/><circle cx="134" cy="127" r="3.8"/></g>
            <ellipse cx="112" cy="154" rx="2.6" ry="2" class="d-ink"/><ellipse cx="128" cy="154" rx="2.6" ry="2" class="d-ink"/>
            <path d="M114 163q6 5 12 0" class="d-mouth"/>
            <circle cx="95" cy="143" r="5" class="d-blush"/><circle cx="145" cy="143" r="5" class="d-blush"/>
          </g>
        </svg>
      </div>
    </header>

    <section id="drawer" class="drawer" aria-labelledby="drawer-heading">
      <div class="section-head">
        <p class="eyebrow">The Drawer</p>
        <h2 id="drawer-heading">서랍 속 잡동사니</h2>
        <span id="count" class="count"></span>
      </div>
      <div id="projects" class="grid"></div>
    </section>

    <footer class="footer">
      <span class="footer-brand">동키의 잡동사니</span>
      <span>서랍 안 도구들은 브라우저에서 바로 동작해요. 외부 서비스는 새 창으로 열려요.</span>
    </footer>
  </div>
  <script type="module" src="./home/home.js"></script>
